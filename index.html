<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Food Store</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN + REGISTER PAGE -->
<div id="authPage">

  <div class="auth-container">

    <h1>🍴 Food Shop</h1>

    <!-- LOGIN -->
    <div class="form-box">

      <h2>Login</h2>

      <input type="email" id="loginEmail" placeholder="Email">

      <input type="password" id="loginPassword" placeholder="Password">

      <button onclick="login()">Login</button>

    </div>

    <!-- REGISTER -->
    <div class="form-box">

      <h2>Register</h2>

      <input type="text" id="registerName" placeholder="Full Name">

      <input type="email" id="registerEmail" placeholder="Email">

      <input type="password" id="registerPassword" placeholder="Password">

      <button onclick="register()">Create Account</button>

    </div>

  </div>

</div>

<!-- MAIN WEBSITE -->
<div id="mainWebsite" style="display:none;">

  <!-- NAVBAR -->
  <nav class="navbar">

    <h2>🍴 Food Shop</h2>

    <div class="nav-links">
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#cartBox">Cart</a>
    </div>

  </nav>

  <!-- HOME -->
  <section id="home" class="hero">

    <h1>Welcome to Food Shop</h1>

    <p>
      Fresh snacks, drinks, and fruits at affordable prices.
    </p>

    <img
      src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1200"
      alt="Food Banner"
    >

  </section>

  <!-- PRODUCTS -->
  <h1 id="products" class="title">Products</h1>

  <div id="productList" class="section"></div>

  <!-- PRODUCT DETAILS -->
  <div id="productModal" class="modal">

    <div class="modal-content">

      <span class="close" onclick="closeModal()">&times;</span>

      <img id="modalImg">

      <h2 id="modalName"></h2>

      <p id="modalSize"></p>

      <p id="modalPrice"></p>

      <p id="modalDesc"></p>

      <button id="modalBtn">Add to Cart</button>

    </div>

  </div>

  <!-- CART -->
  <div id="cartBox">

    <h2>🛒 My Cart</h2>

    <div id="cart">(empty)</div>

    <div id="total">Total: NT$0</div>

    <br>

    <button onclick="clearCart()">Clear Cart</button>

    <button onclick="checkout()">Checkout</button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
